<!doctype html>
<html lang="ms">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="only light">
<meta name="supported-color-schemes" content="light">
<title>SISTEM MAKLUMAT KELAS</title>
<link rel="icon" type="image/png" href="assets/logo.png">
<style>
  :root {
    color-scheme: only light;
    --bg: #f5f6f8; --surface: #ffffff; --ink: #1b2430; --muted: #5f6b7a; --line: #e2e6ec;
    --head: #14284b; --brand: #1e3a6e; --brand-ink: #ffffff; --brand-soft: #e6ecf7;
    --lelaki: #2563eb; --perempuan: #d6336c; --warn: #b45309; --warn-soft: #fef3c7; --err: #b42318; --err-soft: #fde8e6; --ok: #146c43; --ok-soft: #e0f3e8;
    --radius: 12px;
  }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; display: flex; flex-direction: column; background: var(--bg); color: var(--ink); font: 15px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  .wrap { max-width: 1080px; margin: 0 auto; padding-inline: 16px; }
  header { background: var(--head); color: #ffffff; border-bottom: 3px solid var(--brand); }
  header .wrap { padding-block: 18px 0; }
  header h1 { margin: 0; font-size: 1.35rem; letter-spacing: .01em; }
  header p { margin: 2px 0 0; opacity: .85; font-size: .9rem; }
  .head-top { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 8px 24px; padding-bottom: 14px; }
  .brand { display: flex; align-items: center; gap: 14px; min-width: 0; }
  .logo { width: 64px; height: 64px; flex: none; }
  .jam { text-align: right; font-variant-numeric: tabular-nums; }
  .jam .tkh { font-size: .85rem; opacity: .85; }
  .jam .msa { font-size: 1.5rem; font-weight: 700; line-height: 1.2; letter-spacing: .02em; }
  nav { display: flex; gap: 4px; }
  nav button { appearance: none; border: 0; background: transparent; color: inherit; opacity: .75; font: inherit; font-weight: 600; padding: 10px 18px; border-radius: 10px 10px 0 0; cursor: pointer; }
  nav button[aria-selected="true"] { background: var(--bg); color: var(--ink); opacity: 1; }
  nav button:focus-visible { outline: 2px solid currentColor; outline-offset: -2px; }
  main { flex: 1 0 auto; width: 100%; padding-block: 22px 48px; }
  footer { background: var(--head); color: #ffffff; text-align: center; font-size: .85rem; letter-spacing: .02em; padding-block: 14px; border-top: 3px solid var(--brand); }
  footer .wrap { opacity: .9; }
  .card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 18px; }
  .banner { border-radius: 10px; padding: 10px 14px; margin-bottom: 16px; font-size: .9rem; background: var(--warn-soft); color: var(--warn); }
  .banner.err { background: var(--err-soft); color: var(--err); }
  .asof { color: var(--muted); font-size: .9rem; margin: 0 0 14px; }

  .tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: 12px; }
  .tile { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 16px 18px; text-align: center; }
  .tile .lbl { color: var(--muted); font-size: .85rem; font-weight: 600; text-transform: uppercase; letter-spacing: .04em; }
  .tile .num { font-size: 2.4rem; font-weight: 750; line-height: 1.15; font-variant-numeric: tabular-nums; }
  .tile .sub { color: var(--muted); font-size: .85rem; }
  .tile.l .num { color: var(--lelaki); } .tile.p .num { color: var(--perempuan); }
  .bar { display: flex; height: 10px; border-radius: 6px; overflow: hidden; margin: 14px 0 4px; background: var(--line); }
  .bar i { display: block; } .bar .l { background: var(--lelaki); } .bar .p { background: var(--perempuan); }

  .tools { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin: 26px 0 12px; }
  .chip { appearance: none; border: 1px solid var(--line); background: var(--surface); color: var(--ink); font: inherit; font-size: .88rem; padding: 6px 12px; border-radius: 999px; cursor: pointer; }
  .chip[aria-pressed="true"] { background: var(--brand); color: var(--brand-ink); border-color: var(--brand); }
  .tools input[type=search] { margin-left: auto; min-width: 200px; }
  input[type=search], input[type=password] { font: inherit; padding: 8px 12px; border: 1px solid var(--line); border-radius: 8px; background: var(--surface); color: var(--ink); }
  :focus-visible { outline: 2px solid var(--brand); outline-offset: 2px; }
  /* Kotak carian bentuk 3D: bingkai timbul + bahagian dalam tenggelam supaya jelas kelihatan */
  .tools input[type=search] { border: 2px solid #8fa1bf; border-bottom-color: #6f83a6; border-radius: 12px; padding: 10px 14px; background: linear-gradient(#eef2f8, #ffffff 45%);
    box-shadow: inset 0 3px 5px rgba(20, 40, 75, .22), inset 0 -1px 0 #ffffff, 0 1px 0 #ffffff, 0 4px 0 #b4c1d7, 0 8px 14px rgba(20, 40, 75, .22); margin-bottom: 4px; transition: box-shadow .15s, border-color .15s; }
  .tools input[type=search]:focus { outline: 0; border-color: var(--brand); box-shadow: inset 0 3px 5px rgba(20, 40, 75, .22), 0 4px 0 #8ea3c9, 0 8px 16px rgba(30, 58, 110, .3), 0 0 0 4px rgba(30, 58, 110, .18); }
  /* Nota panduan (sentiasa dipaparkan, font kecil) */
  .info-nota { display: flex; gap: 6px; align-items: center; margin: 0 0 8px; padding: 4px 10px; border-radius: 8px; background: var(--brand-soft); color: var(--brand); border: 1px solid #c3d2ee; font-size: .72rem; line-height: 1.35; }
  .info-nota .ic { flex: none; display: inline-grid; place-items: center; width: 14px; height: 14px; border-radius: 50%; background: var(--brand); color: #ffffff; font: italic 700 .62rem/1 Georgia, serif; }
  .info-nota p { margin: 0; }

  .grp { margin: 22px 0 10px; display: flex; flex-wrap: wrap; align-items: baseline; gap: 6px 14px; }
  .grp h2 { margin: 0; font-size: 1.1rem; }
  .grp span { color: var(--muted); font-size: .88rem; font-variant-numeric: tabular-nums; }
  /* Kotak pembahagi setiap tahun */
  .tahun-box { display: flex; flex-wrap: wrap; align-items: center; justify-content: flex-start; gap: 6px 16px; margin: 34px 0 14px; padding: 12px 18px; background: var(--head); color: #ffffff; border-radius: var(--radius); border-left: 6px solid var(--lelaki); }
  #senarai > .tahun-box:first-child { margin-top: 10px; }
  .tahun-box .tn { font-size: 1.15rem; font-weight: 700; letter-spacing: .02em; }
  .tahun-box .st { display: flex; flex-wrap: wrap; gap: 8px; }
  .tahun-box .pill { background: rgba(255, 255, 255, .14); padding: 4px 12px; border-radius: 999px; font-size: .85rem; font-variant-numeric: tabular-nums; white-space: nowrap; }
  .tahun-box .pill i { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 6px; }
  .tahun-box .dl { background: #7aa2ff; } .tahun-box .dp { background: #ff86b0; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 12px; }
  .kelas { text-align: left; font: inherit; color: inherit; cursor: pointer; background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 14px 16px; }
  .kelas:hover { border-color: var(--brand); }
  .kelas .nm { font-weight: 700; }
  .kelas .tot { font-size: 1.8rem; font-weight: 750; font-variant-numeric: tabular-nums; margin: 4px 0 2px; }
  .kelas .tot small { font-size: .8rem; font-weight: 500; color: var(--muted); }
  .kelas .lp { display: flex; gap: 14px; font-size: .88rem; font-variant-numeric: tabular-nums; }
  .kelas .lp .l { color: var(--lelaki); } .kelas .lp .p { color: var(--perempuan); }
  .empty { text-align: center; color: var(--muted); padding: 48px 16px; }

  dialog { border: 0; border-radius: 14px; padding: 0; width: min(980px, calc(100vw - 24px)); max-height: calc(100vh - 32px); background: var(--surface); color: var(--ink); }
  dialog::backdrop { background: rgba(10, 15, 20, .55); }
  .dlg-h { display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: center; padding: 16px 20px; border-bottom: 1px solid var(--line); position: sticky; top: 0; background: var(--surface); }
  .dlg-h h2 { margin: 0; font-size: 1.15rem; }
  .dlg-h .meta { color: var(--muted); font-size: .9rem; font-variant-numeric: tabular-nums; }
  .dlg-h .meta .l { color: var(--lelaki); } .dlg-h .meta .p { color: var(--perempuan); }
  .dlg-h .acts { margin-left: auto; display: flex; flex-wrap: wrap; gap: 8px; }
  .dlg-b { padding: 18px 20px 22px; display: grid; gap: 16px; }
  .fld > label, .fld > .lbl { display: block; font-weight: 600; margin-bottom: 6px; }
  .fld select { width: 100%; font: inherit; padding: 8px 10px; border: 1px solid var(--line); border-radius: 8px; background: var(--surface); color: var(--ink); }
  .fld .opt { display: flex; align-items: center; gap: 8px; padding: 4px 0; }
  .fld .opt.dis { color: var(--muted); }
  .fld .hint { color: var(--muted); font-size: .85rem; margin: 2px 0 0; }
  .acts-row { display: flex; flex-wrap: wrap; gap: 8px; }
  .tools .btn { margin-left: auto; }
  .tools .btn + input[type=search] { margin-left: 0; }
  .btn { appearance: none; font: inherit; font-weight: 600; border: 1px solid var(--line); background: var(--surface); color: var(--ink); padding: 8px 14px; border-radius: 8px; cursor: pointer; }
  .btn.primary { background: var(--brand); color: var(--brand-ink); border-color: var(--brand); }
  .btn.pdf { background: #1d4ed8; color: #ffffff; border-color: #1d4ed8; }
  .btn.xls { background: #15803d; color: #ffffff; border-color: #15803d; }
  .btn.tutup { background: #b91c1c; color: #ffffff; border-color: #b91c1c; }
  .btn.pdf:hover, .btn.xls:hover, .btn.tutup:hover { filter: brightness(1.12); }
  .btn.pdf:active, .btn.xls:active, .btn.tutup:active { filter: brightness(.92); }
  .tbl { overflow-x: auto; }
  table { border-collapse: collapse; width: 100%; font-size: .9rem; }
  th, td { padding: 8px 12px; text-align: left; border-bottom: 1px solid var(--line); white-space: nowrap; }
  th { position: sticky; top: 0; background: var(--surface); font-size: .78rem; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); }
  td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; }
  td.nama { white-space: normal; min-width: 200px; }
  .jl { color: var(--lelaki); font-weight: 600; } .jp { color: var(--perempuan); font-weight: 600; }
  tr.off td { color: var(--muted); }
  .link { appearance: none; border: 0; background: none; padding: 0; font: inherit; color: var(--brand); text-decoration: underline; cursor: pointer; }
  .badge { font-size: .75rem; padding: 2px 8px; border-radius: 999px; background: var(--brand-soft); color: var(--brand); font-weight: 600; }
  .badge.off { background: var(--warn-soft); color: var(--warn); }

  .login { max-width: 380px; margin: 24px auto; }
  .login h2, .card h2 { margin-top: 0; font-size: 1.1rem; }
  .login form { display: flex; gap: 8px; }
  .login input { flex: 1; min-width: 0; }
  .msg { margin: 10px 0 0; font-size: .9rem; color: var(--err); min-height: 1.3em; }
  .drop { display: block; border: 2px dashed var(--line); border-radius: var(--radius); padding: 34px 16px; text-align: center; cursor: pointer; color: var(--muted); }
  .drop:hover, .drop.over { border-color: var(--brand); background: var(--brand-soft); color: var(--ink); }
  .drop strong { color: var(--ink); display: block; font-size: 1.05rem; margin-bottom: 4px; }
  .drop input { position: absolute; opacity: 0; width: 1px; height: 1px; }
  .drop:focus-within { outline: 2px solid var(--brand); outline-offset: 2px; }
  .result { margin-top: 14px; padding: 12px 14px; border-radius: 10px; font-size: .92rem; }
  .result.ok { background: var(--ok-soft); color: var(--ok); } .result.err { background: var(--err-soft); color: var(--err); } .result.wait { background: var(--brand-soft); color: var(--brand); }
  .adm-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 14px; }
  .adm-head h2 { margin: 0; }
  dl.info { display: grid; grid-template-columns: max-content 1fr; gap: 4px 16px; margin: 0; font-size: .92rem; }
  dl.info dt { color: var(--muted); } dl.info dd { margin: 0; font-variant-numeric: tabular-nums; }
  .stack > * + * { margin-top: 14px; }
  [hidden] { display: none !important; }

  /* ---- Mudah alih ---- */
  @media screen and (max-width: 640px) {
    .wrap { padding-inline: 14px; }
    header .wrap { padding-block: 14px 0; }
    .head-top { flex-direction: column; align-items: stretch; gap: 8px; padding-bottom: 10px; }
    .logo { width: 48px; height: 48px; }
    .brand { gap: 12px; }
    header h1 { font-size: 1.05rem; line-height: 1.25; }
    header p { font-size: .8rem; }
    .jam { text-align: left; display: flex; align-items: baseline; justify-content: space-between; gap: 10px; }
    .jam .msa { font-size: 1.15rem; }
    nav { gap: 2px; }
    nav button { flex: 1; padding: 11px 8px; }
    main { padding-block: 16px 32px; }
    .tiles { grid-template-columns: 1fr 1fr; gap: 10px; }
    .tiles .tile:first-child { grid-column: 1 / -1; text-align: center; }
    .tile { padding: 12px 14px; }
    .tile .num { font-size: 2rem; }
    .tools { margin-top: 20px; justify-content: center; }
    .chip { padding: 8px 14px; }
    .tools input[type=search] { order: 1; flex: 1 1 100%; margin: 0; min-width: 0; }
    .tools .btn { order: 2; flex: 1 1 100%; margin-left: 0; min-height: 44px; }
    input, select, textarea { font-size: 16px !important; }
    .btn { min-height: 42px; }
    .grid { grid-template-columns: repeat(2, 1fr); gap: 10px; }
    .kelas { padding: 12px; }
    .kelas .nm { font-size: .88rem; overflow-wrap: anywhere; }
    .kelas .tot { font-size: 1.5rem; }
    .kelas .lp { flex-wrap: wrap; gap: 0 10px; font-size: .82rem; }
    .grp h2 { font-size: 1rem; }
    .tahun-box { margin-top: 26px; padding: 10px 14px; border-left-width: 5px; }
    .tahun-box .tn { font-size: 1.05rem; }
    .tahun-box .pill { padding: 3px 10px; font-size: .8rem; }
    .banner code { overflow-wrap: anywhere; }
    /* Dialog skrin penuh */
    dialog { width: 100vw; max-width: 100vw; height: 100vh; height: 100dvh; max-height: 100vh; max-height: 100dvh; margin: 0; border-radius: 0; }
    .dlg-h { padding: 12px 14px; gap: 6px 12px; }
    .dlg-h h2 { font-size: 1.05rem; }
    .dlg-h .acts.multi { margin-left: 0; width: 100%; }
    .dlg-h .acts.multi .btn { flex: 1; padding-inline: 8px; }
    .dlg-b { padding: 14px; }
    .acts-row .btn { flex: 1 1 100%; }
    /* Jadual murid -> kad bersusun (label dari data-l) */
    table.resp thead { display: none; }
    table.resp, table.resp tbody { display: block; width: 100%; }
    table.resp tr { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 6px 10px; padding: 10px 14px; border-bottom: 1px solid var(--line); }
    table.resp td { display: block; padding: 0; border: 0; white-space: normal; text-align: left; min-width: 0; overflow-wrap: anywhere; font-size: .85rem; }
    table.resp td::before { content: attr(data-l); display: block; font-size: .68rem; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); font-weight: 500; }
    table.resp td.nama { grid-column: 1 / -1; order: -1; font-weight: 700; font-size: .98rem; min-width: 0; }
    table.resp td.num { text-align: left; }
    .login { margin: 8px auto; }
    .login form { flex-direction: column; }
    .adm-head { flex-wrap: wrap; }
    .drop { padding: 26px 12px; }
    dl.info { grid-template-columns: 1fr; gap: 0; }
    dl.info dd { margin-bottom: 8px; }
  }

  /* ---- Cetakan (A4). Kandungan dibina dalam #cetak sebelum window.print() ---- */
  #cetak { display: none; }
  @media print {
    @page { size: A4; margin: 12mm; }
    html, body { background: #fff !important; color: #000 !important; font-size: 11px; display: block !important; min-height: 0 !important; }
    body > *:not(#cetak) { display: none !important; }
    #cetak { display: block; color: #000; background: #fff; }
    #cetak .pg { break-after: page; }
    #cetak .pg:last-child { break-after: auto; }
    #cetak .kp { display: flex; align-items: center; gap: 10px; }
    #cetak .kp img { width: 46px; height: 46px; flex: none; }
    #cetak h1 { font-size: 15px; margin: 0; }
    #cetak h2 { font-size: 13px; margin: 2px 0; }
    #cetak p { margin: 2px 0; font-size: 10px; color: #333; }
    #cetak .ct { font-size: 11px; color: #000; font-weight: 600; margin: 8px 0 6px; }
    #cetak table { width: 100%; border-collapse: collapse; font-size: 10px; margin-top: 4px; }
    #cetak th, #cetak td { position: static; border: 1px solid #555; padding: 2px 5px; text-align: left; white-space: nowrap; color: #000; letter-spacing: 0; text-transform: none; }
    #cetak td:nth-child(3), #cetak td:nth-child(6) { white-space: normal; }
    #cetak th { background: #e5e5e5 !important; font-size: 9.5px; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
    #cetak th.num, #cetak td.num { text-align: right; }
    #cetak thead { display: table-header-group; }
    #cetak tr { break-inside: avoid; }
    #cetak tr.sub td { font-weight: 700; background: #f0f0f0 !important; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
    #cetak tr.off td { color: #555; font-style: italic; }
  }
</style>
</head>
<body>
<header>
  <div class="wrap">
    <div class="head-top">
      <div class="brand">
        <img class="logo" src="assets/logo.png" alt="Logo SK Seri Jaya" width="64" height="64">
        <div>
          <h1>SISTEM MAKLUMAT KELAS</h1>
          <p id="sekolah">Paparan Guru Kelas</p>
        </div>
      </div>
      <div class="jam" role="timer" aria-label="Tarikh dan masa semasa">
        <div class="tkh" id="tarikh"></div>
        <div class="msa" id="masa"></div>
      </div>
    </div>
    <nav role="tablist" aria-label="Menu utama">
      <button role="tab" id="t-murid" aria-controls="p-murid" aria-selected="true">Maklumat Kelas</button>
      <button role="tab" id="t-admin" aria-controls="p-admin" aria-selected="false">Admin</button>
    </nav>
  </div>
</header>

<main class="wrap">
  <div id="banner"></div>

  <!-- ===== Tab: Maklumat Murid ===== -->
  <section id="p-murid" role="tabpanel" aria-labelledby="t-murid"></section>

  <!-- ===== Tab: Admin ===== -->
  <section id="p-admin" role="tabpanel" aria-labelledby="t-admin" hidden>
    <div id="login" class="card login">
      <h2>Log masuk Admin</h2>
      <form id="login-form" autocomplete="off">
        <input type="password" id="pw" placeholder="Kata laluan" aria-label="Kata laluan admin" required>
        <button class="btn primary" type="submit">Masuk</button>
      </form>
      <p class="msg" id="login-msg" role="alert"></p>
    </div>

    <div id="panel" class="stack" hidden>
      <div class="card">
        <div class="adm-head">
          <h2>Muat naik senarai murid</h2>
          <button class="btn" id="logout" type="button">Log keluar</button>
        </div>
        <label class="drop" id="drop">
          <input type="file" id="file" accept=".xlsx,.xls">
          <strong>Klik di sini atau seret fail Excel (.xlsx) ke sini</strong>
          Fail dibaca dan dianalisis serta-merta. Data lama akan diganti.
        </label>
        <div id="result" role="status"></div>
      </div>
      <div class="card">
        <h2>Data semasa dalam sistem</h2>
        <div id="current"></div>
      </div>
    </div>
  </section>
</main>

<footer><div class="wrap">Mohd Shahril | SK Seri Jaya | Terengganu</div></footer>

<dialog id="dlg" aria-labelledby="dlg-title"></dialog>
<div id="cetak" aria-hidden="true"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="firebase-config.js"></script>
<script src="parser.js"></script>
<script type="module">
const ADMIN_PASSWORD = 'sksj';
const $ = (s) => document.querySelector(s);
const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const BULAN = ['Januari', 'Februari', 'Mac', 'April', 'Mei', 'Jun', 'Julai', 'Ogos', 'September', 'Oktober', 'November', 'Disember'];
const namaTahun = (t) => t === 0 ? 'Prasekolah' : t === 99 ? 'Lain-lain' : 'Tahun ' + t;
const aktif = (m) => !m.status || m.status === 'BERSEKOLAH';
const fmtTarikh = (ymd) => { const m = /^(\d{4})-(\d{2})-(\d{2})/.exec(ymd || ''); return m ? `${+m[3]} ${BULAN[+m[2] - 1]} ${m[1]}` : ''; };
const fmtMasa = (iso) => { const d = new Date(iso); return isNaN(d) ? '' : `${d.getDate()} ${BULAN[d.getMonth()]} ${d.getFullYear()}, ${String(d.getHours()).padStart(2, '0')}:${String(d.getMinutes()).padStart(2, '0')}`; };

/* ---------- Storan: Firebase Firestore (atau mod ujian setempat) ---------- */
const cfg = window.FIREBASE_CONFIG || {};
const firebaseSedia = !!cfg.apiKey && !/^ISI_/.test(cfg.apiKey) && !/^ISI_/.test(cfg.projectId || '');
let store;

if (firebaseSedia) {
  const V = '12.19.0';
  const { initializeApp } = await import(`https://www.gstatic.com/firebasejs/${V}/firebase-app.js`);
  const { getFirestore, doc, onSnapshot, setDoc } = await import(`https://www.gstatic.com/firebasejs/${V}/firebase-firestore.js`);
  const ref = doc(getFirestore(initializeApp(cfg)), 'data', 'murid');
  store = {
    mode: 'firebase',
    subscribe: (cb, onErr) => onSnapshot(ref, (s) => cb(s.exists() ? s.data() : null), onErr),
    save: (d) => setDoc(ref, d)
  };
} else {
  const KEY = 'smm_data_ujian';
  const baca = () => { try { return JSON.parse(localStorage.getItem(KEY)); } catch { return null; } };
  const subs = new Set();
  window.addEventListener('storage', () => subs.forEach((cb) => cb(baca())));
  store = {
    mode: 'ujian',
    subscribe: (cb) => { subs.add(cb); cb(baca()); },
    save: async (d) => { localStorage.setItem(KEY, JSON.stringify(d)); subs.forEach((cb) => cb(d)); }
  };
}

/* ---------- Analisis ---------- */
function analisis(data) {
  const kelasMap = new Map();
  let l = 0, p = 0;
  for (const m of data.murid) {
    const key = m.t + '|' + m.kelas;
    if (!kelasMap.has(key)) kelasMap.set(key, { key, t: m.t, kelas: m.kelas, murid: [], l: 0, p: 0, jumlah: 0 });
    const k = kelasMap.get(key);
    k.murid.push(m);
    if (!aktif(m)) continue;
    k.jumlah++;
    if (m.j === 'L') { k.l++; l++; } else if (m.j === 'P') { k.p++; p++; }
  }
  const kelas = [...kelasMap.values()].sort((a, b) => a.t - b.t || a.kelas.localeCompare(b.kelas, 'ms'));
  const tahun = new Map();
  for (const k of kelas) {
    if (!tahun.has(k.t)) tahun.set(k.t, { t: k.t, kelas: [], jumlah: 0, l: 0, p: 0 });
    const g = tahun.get(k.t);
    g.kelas.push(k); g.jumlah += k.jumlah; g.l += k.l; g.p += k.p;
  }
  return { jumlah: l + p + data.murid.filter((m) => aktif(m) && m.j === '?').length, l, p, kelas, tahun: [...tahun.values()] };
}

const HAD_HASIL = 100;

function paparHasilMurid(q) {
  const box = $('#hasil');
  const kata = q.split(/\s+/).filter(Boolean);
  if (!kata.length) { box.innerHTML = ''; return 0; }
  // Carian nama merentas semua kelas; setiap perkataan mesti ada dalam nama (susunan bebas).
  const padan = data.murid.filter((m) => { const n = m.nama.toLowerCase(); return kata.every((w) => n.includes(w)); })
    .sort((a, b) => a.nama.localeCompare(b.nama, 'ms'));
  if (!padan.length) { box.innerHTML = ''; return 0; }
  const tunjuk = padan.slice(0, HAD_HASIL);
  box.innerHTML = `
    <div class="grp"><h2>Murid dijumpai</h2><span>${padan.length} murid${padan.length > HAD_HASIL ? ` (dipaparkan ${HAD_HASIL} pertama, sila kecilkan carian)` : ''}</span></div>
    <div class="card tbl" style="padding:0"><table class="resp">
      <thead><tr><th class="num">Bil.</th><th>ID Murid</th><th>Nama</th><th>No. KP</th><th>Status</th><th>Nama Kelas</th><th>Jantina</th></tr></thead>
      <tbody>${tunjuk.map((m, i) => `<tr class="${aktif(m) ? '' : 'off'}">
        <td class="num" data-l="Bil.">${i + 1}</td><td data-l="ID Murid">${esc(m.id)}</td><td class="nama">${esc(m.nama)}</td><td data-l="No. KP">${esc(m.kp)}</td>

}

/* ---------- Cetak / Muat turun ---------- */
const kelasSkop = (skop) =>
  skop === 'semua' ? A.kelas
  : skop.startsWith('t:') ? A.kelas.filter((k) => String(k.t) === skop.slice(2))
  : A.kelas.filter((k) => k.key === skop.slice(2));
const namaSkop = (skop) =>
  skop === 'semua' ? 'Semua murid'
  : skop.startsWith('t:') ? namaTahun(+skop.slice(2))
  : (A.kelas.find((k) => k.key === skop.slice(2)) || {}).kelas || '';
const jumlahKelas = (ks) => ks.reduce((s, k) => ({ l: s.l + k.l, p: s.p + k.p, jumlah: s.jumlah + k.jumlah }), { l: 0, p: 0, jumlah: 0 });
const kumpulTahun = (ks) => A.tahun.map((g) => ({ t: g.t, kelas: g.kelas.filter((k) => ks.includes(k)) })).filter((g) => g.kelas.length);

async function cetak(ks, jenis, nama) {
  if (!ks.length) return;
  let html;
  if (jenis === 'ringkasan') {
    const baris = (n, r, cls = '') => `<tr class="${cls}"><td>${esc(n)}</td><td class="num">${r.l}</td><td class="num">${r.p}</td><td class="num">${r.jumlah}</td></tr>`;
    const badan = kumpulTahun(ks).map((g) =>
      g.kelas.map((k) => baris(k.kelas, k)).join('') + baris('Jumlah ' + namaTahun(g.t), jumlahKelas(g.kelas), 'sub')).join('');
    html = `<section class="pg">${kepalaCetak('Ringkasan Bilangan Murid — ' + esc(nama || 'Semua murid'))}
      <table><thead><tr><th>Kelas</th><th class="num">Lelaki</th><th class="num">Perempuan</th><th class="num">Jumlah</th></tr></thead>
      <tbody>${badan}${baris('JUMLAH KESELURUHAN', jumlahKelas(ks), 'sub')}</tbody></table></section>`;
  } else {
    html = ks.map((k) => `<section class="pg">${kepalaCetak('Senarai Murid — ' + esc(k.kelas))}
      <p class="ct">Jumlah ${k.jumlah} murid · Lelaki ${k.l} · Perempuan ${k.p}</p>
      <table><thead><tr>${TAJUK_LAJUR.map((t, i) => `<th${i === 0 ? ' class="num"' : ''}>${t}</th>`).join('')}</tr></thead>
      <tbody>${muridUrut(k).map((m, i) => `<tr class="${aktif(m) ? '' : 'off'}"><td class="num">${i + 1}</td><td>${esc(m.id)}</td><td>${esc(m.nama)}</td><td>${esc(m.kp)}</td><td>${esc(m.status || '-')}</td><td>${esc(m.kelas)}</td><td>${teksJantina(m.j)}</td></tr>`).join('')}</tbody></table></section>`).join('');
  }
  const kotak = $('#cetak');
  kotak.innerHTML = html;
  // Tunggu semua logo siap dimuat & dinyahkod dahulu; jika tidak, sesetengah halaman tercetak tanpa logo.
  const siap = Promise.all([...kotak.querySelectorAll('img')].map((im) => im.decode().catch(() => {})));
  await Promise.race([siap, new Promise((r) => setTimeout(r, 3000))]); // had masa: jangan sampai cetakan tersekat
  await new Promise((r) => setTimeout(r, 100)); // beri masa pelayar melukis semula sebelum tangkapan cetak
  window.print();
}

function muatTurun(ks, jenis, nama) {
  if (!ks.length) return;
  if (typeof XLSX === 'undefined') { alert('Pustaka Excel gagal dimuatkan. Semak sambungan internet dan cuba semula.'); return; }
  const wb = XLSX.utils.book_new();
  const guna = new Set();
  const namaLembaran = (s) => {
    const asas = s.replace(/[\\\/?*\[\]:]/g, ' ').trim().slice(0, 28) || 'Lembaran';
    let n = asas, i = 2;
    while (guna.has(n.toLowerCase())) n = asas + ' ' + i++;
    guna.add(n.toLowerCase());
    return n;
  };
  const tambah = (tajuk, aoa, lebar) => {
    const ws = XLSX.utils.aoa_to_sheet(aoa);
    ws['!cols'] = lebar.map((wch) => ({ wch }));
    XLSX.utils.book_append_sheet(wb, ws, namaLembaran(tajuk));
  };
  if (jenis === 'ringkasan' || ks.length > 1) {
    const aoa = [['KELAS', 'LELAKI', 'PEREMPUAN', 'JUMLAH']];
    for (const g of kumpulTahun(ks)) {
      g.kelas.forEach((k) => aoa.push([k.kelas, k.l, k.p, k.jumlah]));
      const t = jumlahKelas(g.kelas); aoa.push(['Jumlah ' + namaTahun(g.t), t.l, t.p, t.jumlah]);
    }
    const t = jumlahKelas(ks); aoa.push(['JUMLAH KESELURUHAN', t.l, t.p, t.jumlah]);
    tambah('Ringkasan', aoa, [32, 10, 12, 10]);
  }
  if (jenis === 'senarai') {
    for (const k of ks) {
      tambah(k.kelas, [TAJUK_LAJUR, ...muridUrut(k).map((m, i) => [i + 1, m.id, m.nama, m.kp, m.status, m.kelas, teksJantina(m.j)])], [6, 14, 44, 15, 13, 26, 12]);
    }
  }
  const tarikh = data.tarikhData || new Date().toISOString().slice(0, 10);
  const fail = `${jenis === 'senarai' ? 'Senarai Murid' : 'Ringkasan Murid'} - ${(nama || 'Semua murid').replace(/[\\\/:*?"<>|]/g, ' ')} - ${tarikh}.xlsx`;
  XLSX.writeFile(wb, fail);
}

function setResult(kind, html) { $('#result').innerHTML = html ? `<div class="result ${kind}">${html}</div>` : ''; }

async function uploadFail(file) {
  if (!file) return;
  setResult('wait', `Membaca <strong>${esc(file.name)}</strong>…`);
  try {
    if (typeof XLSX === 'undefined') throw new Error('Pustaka pembaca Excel gagal dimuatkan. Semak sambungan internet dan cuba semula.');
    if (!/\.xlsx?$/i.test(file.name)) throw new Error('Sila pilih fail Excel (.xlsx).');
    const wb = XLSX.read(await file.arrayBuffer(), { type: 'array' });
    const rows = XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]], { header: 1, defval: '', raw: false });
    const h = SMM.parse(rows, { fileName: file.name });
    const doc = { sekolah: h.sekolah, kod: h.kod, tarikhData: h.tarikhData, namaFail: file.name, dikemaskini: new Date().toISOString(), murid: h.murid };
    await store.save(doc);
    const a = analisis(doc);
    let nota = '';
    if (h.tidakAktif) nota += `<br>${h.tidakAktif} murid berstatus bukan BERSEKOLAH (dipaparkan tetapi tidak dikira dalam jumlah).`;
    if (h.jantinaLain) nota += `<br>Amaran: ${h.jantinaLain} murid tiada jantina yang sah.`;
    setResult('ok', `<strong>Berjaya.</strong> ${a.jumlah} murid aktif dalam ${a.kelas.length} kelas — Lelaki ${a.l}, Perempuan ${a.p}.${nota}`);
  } catch (e) {
    console.error(e);
    setResult('err', `<strong>Gagal:</strong> ${esc(e.message || e)}`);
  } finally {
    $('#file').value = '';
  }
}

  }
}
const adminMasuk = () => sessionStorage.getItem('smm_admin') === '1';
function segarAdmin() { $('#login').hidden = adminMasuk(); $('#panel').hidden = !adminMasuk(); }

$('#t-murid').onclick = () => pilihTab('murid');
$('#t-admin').onclick = () => { pilihTab('admin'); segarAdmin(); };
$('#login-form').onsubmit = (e) => {
  e.preventDefault();
  if ($('#pw').value === ADMIN_PASSWORD) { sessionStorage.setItem('smm_admin', '1'); $('#login-msg').textContent = ''; segarAdmin(); }
  else $('#login-msg').textContent = 'Kata laluan salah.';
  $('#pw').value = '';
};
$('#logout').onclick = () => { sessionStorage.removeItem('smm_admin'); setResult('', ''); segarAdmin(); };
$('#file').onchange = (e) => uploadFail(e.target.files[0]);
const drop = $('#drop');
['dragenter', 'dragover'].forEach((ev) => drop.addEventListener(ev, (e) => { e.preventDefault(); drop.classList.add('over'); }));
['dragleave', 'drop'].forEach((ev) => drop.addEventListener(ev, (e) => { e.preventDefault(); drop.classList.remove('over'); }));
drop.addEventListener('drop', (e) => uploadFail(e.dataTransfer.files[0]));

/* ---------- Jam & tarikh pada header ---------- */
const HARI = ['Ahad', 'Isnin', 'Selasa', 'Rabu', 'Khamis', 'Jumaat', 'Sabtu'];
const dua = (n) => String(n).padStart(2, '0');
function kemaskiniJam() {
  const d = new Date();
  $('#tarikh').textContent = `${HARI[d.getDay()]}, ${d.getDate()} ${BULAN[d.getMonth()]} ${d.getFullYear()}`;
  $('#masa').textCsssontent = `${dua(d.getHours())}:${dua(d.getMinutes())}:${dua(d.getSeconds())}`;
}
kemaskiniJam();
setInterval(kemaskiniJam, 1000);

/* ---------- Mula ---------- */
if (store.mode === 'ujian') $('#banner').innerHTML = '<div class="banner"><strong>Mod ujian:</strong> Firebase belum disediakan, data disimpan dalam pelayar ini sahaja. Isi <code>firebase-config.js</code> supaya semua guru boleh melihat data yang sama.</div>';

store.subscribe((d) => {
  data = d; A = d ? analisis(d) : null;
  if (d && d.sekolah) $('#sekolah').textContent = `${d.sekolah}${d.kod ? ' · ' + d.kod : ''} — Paparan Guru Kelas`;
  paparMurid(); paparSemasa();
}, (err) => {
  console.error(err);
  $('#banner').innerHTML = `<div class="banner err"><strong>Tidak dapat menyambung ke Firebase:</strong> ${esc(err.code || err.message)}. Semak config dan peraturan Firestore.</div>`;
});
segarAdmin();
</script>
</body>
</html>
